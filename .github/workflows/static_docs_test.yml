# Workflow for manually deploying static content to GitHub Pages
name: Manual Deploy to Pages

on:
  # Only allow manual execution from the Actions tab
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'MSP_needs_demo'
        type: string
      folder_path:
        description: 'Folder path containing the content to deploy'
        required: true
        default: '_build'
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate folder path exists
        run: |
          if [ ! -d "${{ github.event.inputs.folder_path }}" ]; then
            echo "Error: The specified folder '${{ github.event.inputs.folder_path }}' does not exist!"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the specified path from the selected branch
          path: '${{ github.event.inputs.folder_path }}'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
