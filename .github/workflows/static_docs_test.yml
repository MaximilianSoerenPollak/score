# Workflow for manually deploying an entire folder to GitHub Pages
name: Manual Deploy Folder to Pages

on:
  # Only allow manual execution from the Actions tab
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'MSP_needs_demo'
        type: string
      folder_path:
        description: 'Folder path containing the website to deploy'
        required: true
        default: '_build'
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Validate folder path exists
        run: |
          if [ ! -d "${{ github.event.inputs.folder_path }}" ]; then
            echo "Error: The specified folder '${{ github.event.inputs.folder_path }}' does not exist!"
            exit 1
          fi
          
      - name: List folder contents (debug)
        run: |
          echo "Contents of the specified folder:"
          ls -la ${{ github.event.inputs.folder_path }}
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire specified folder with all files and subdirectories
          path: '${{ github.event.inputs.folder_path }}'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
